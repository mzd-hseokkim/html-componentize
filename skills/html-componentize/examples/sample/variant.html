<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Variant</title>
<style>
  .card { border: 1px solid #ddd; border-radius: 12px; }
  .card-inner { padding: 8px; }
  .card-img { width: 100%; }
  .card-body { padding: 16px; }
  .card-title { font-weight: 600; }
  .card-desc { color: #666; }
</style></head>
<body>
  <main class="grid">
    <article class="card"><div class="card-inner">
      <img class="card-img" src="/a.jpg" alt="A">
      <div class="card-body"><h3 class="card-title">A</h3><p class="card-desc">first</p></div>
    </div></article>
    <article class="card"><div class="card-inner">
      <img class="card-img" src="/b.jpg" alt="B">
      <div class="card-body"><h3 class="card-title">B</h3><p class="card-desc">second</p></div>
    </div></article>
  </main>
</body></html>
