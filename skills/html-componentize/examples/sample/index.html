<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sample</title>
  <style>
    :root { --brand: #3b82f6; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; color: #222; }
    .page { max-width: 960px; margin: 0 auto; padding: 24px; }
    .site-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; }
    .logo { font-size: 20px; font-weight: 700; }
    .card-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .card { border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden; background: #fff; }
    .card-img { width: 100%; height: 140px; object-fit: cover; display: block; }
    .card-body { padding: 16px; }
    .card-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
    .card-desc { font-size: 14px; color: #6b7280; }
    .site-footer { text-align: center; padding: 24px 0; color: #9ca3af; font-size: 13px; }
    @media (max-width: 640px) { .card-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="page">
    <header class="site-header">
      <div class="logo">Acme</div>
      <nav class="nav"><a href="/about">About</a></nav>
    </header>
    <main class="card-grid">
      <article class="card">
        <img class="card-img" src="/img/a.jpg" alt="Alpha" />
        <div class="card-body">
          <h3 class="card-title">Alpha</h3>
          <p class="card-desc">First product in the lineup.</p>
        </div>
      </article>
      <article class="card">
        <img class="card-img" src="/img/b.jpg" alt="Beta" />
        <div class="card-body">
          <h3 class="card-title">Beta</h3>
          <p class="card-desc">Second product in the lineup.</p>
        </div>
      </article>
      <article class="card">
        <img class="card-img" src="/img/c.jpg" alt="Gamma" />
        <div class="card-body">
          <h3 class="card-title">Gamma</h3>
          <p class="card-desc">Third product in the lineup.</p>
        </div>
      </article>
    </main>
    <footer class="site-footer">© 2026 Acme</footer>
  </div>
</body>
</html>
